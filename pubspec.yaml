name: oreate_music
description: "OreateMusic — Flutter music app with Supabase auth, catalog, downloads and offline player."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  just_audio: ^0.9.44
  path_provider: ^2.1.3
  dio: ^5.7.0
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
